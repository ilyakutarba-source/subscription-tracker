spring:
  application:
    name: subscription-tracker
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  bootstrap:
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
    initial-admin-display-name: ${INITIAL_ADMIN_DISPLAY_NAME:Legacy owner}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
