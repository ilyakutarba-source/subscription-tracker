<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · Subscription Tracker</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">S</span><span>Subscription Tracker</span></a>
    <section class="auth-card">
        <p class="eyebrow">Get started</p>
        <h1>Create account</h1>
        <p class="auth-intro">Your subscriptions will be visible only to this account.</p>
        <form class="auth-form" method="post" th:action="@{/signup}" th:object="${signupForm}">
            <div class="field">
                <label for="displayName">Display name</label>
                <input id="displayName" type="text" th:field="*{displayName}" maxlength="120" autocomplete="name" th:classappend="${#fields.hasErrors('displayName')} ? ' invalid'">
                <span class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" maxlength="320" autocomplete="username" th:classappend="${#fields.hasErrors('email')} ? ' invalid'">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" maxlength="72" autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? ' invalid'">
                <span class="field-hint">Use at least 8 characters.</span>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" th:classappend="${#fields.hasErrors('confirmPassword')} ? ' invalid'">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>
            <button class="button button-primary" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>
